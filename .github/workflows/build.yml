name: Build desktop apps
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: python -m pip install -r engine/requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Bundle local processing tools
        run: npm run engine:bundle
        env:
          EVERYDAY_PYTHON: python
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run desktop:build -- --bundles nsis
      - name: Build Mac app and DMG
        if: runner.os == 'macOS'
        run: npm run desktop:build -- --bundles app,dmg
      - uses: actions/upload-artifact@v4
        with:
          name: everyday-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
